_syntax_definition: &syntax_definition
  summary: A piece of Nox project or task syntax.
  details:
    - Syntax terms are interpreted by the nox.build or noxfile parser and are not shell commands by themselves.
    - Their accepted values and scope are defined by the project-file and task references.
  examples:
    - project "app" { }
    - 'tasks: format: run: cargo fmt --all'
  links:
    - label: Read the nox.build reference
      href: /build
    - label: Read the noxfile reference
      href: /tasks

":=": *syntax_definition
"@": *syntax_definition
"@nox clean + @nox build": *syntax_definition
"NAME := VALUE": *syntax_definition
"set NAME := VALUE": *syntax_definition
let: *syntax_definition
"run:": *syntax_definition
"{{build_dir}}": *syntax_definition
"{{version}}": *syntax_definition
"task test": *syntax_definition
"glob(\"src/*.c\")": *syntax_definition
"glob(...)": *syntax_definition

_tool_definition: &tool_definition
  summary: An external compiler, linker, archiver, runtime, or tool used by Nox.
  details:
    - Nox looks up tools through PATH and reports a missing dependency when the relevant action needs it.
    - The selected executable is passed argument vectors by the build executor or Runner backend.
  examples:
    - nox status
    - nox riders
  links:
    - label: Read toolchain detection
      href: /docs/toolchains

