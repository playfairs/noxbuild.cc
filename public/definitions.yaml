nox.build:
  summary: The declarative project file for Nox.
  details:
    - Defines project metadata, settings, targets, source files, compiler flags, dependencies, and install behavior.
    - It is intentionally separate from noxfile, which is for task automation rather than the compilation graph.
  examples:
    - project "hello" { executable "hello" { sources = ["src/main.c"] } }
    - nox validate
  links:
    - label: Read the nox.build reference
      href: /build
    - label: See the full documentation
      href: /docs

noxfile:
  summary: The optional task-automation file.
  details:
    - Defines named tasks such as format, check, build, and test.
    - Tasks can run shell commands, call other tasks with @nox, and interpolate project values.
  examples:
    - nox task format
    - nox tasks
  links:
    - label: Read the noxfile reference
      href: /tasks

Rider:
  summary: A language and toolchain backend used to build project targets.
  details:
    - Riders map source extensions to compilers, linkers, runtimes, or packaging actions.
    - The build graph stays language agnostic while each Rider owns language-specific tool behavior.
  examples:
    - executable "tool" { sources = ["main.go"] }
    - nox riders
  links:
    - label: Explore Riders
      href: /riders

Riders:
  summary: Nox's built-in language build backends.
  details:
    - The catalog includes C, C++, Rust, Haskell, D, Go, Java, C#, Swift, Zig, Python, JavaScript, TypeScript, and Kotlin.
    - Missing external tools are reported when the relevant target needs to build.
  examples:
    - nox riders
  links:
    - label: Explore Riders
      href: /riders

Runner:
  summary: A direct-file execution handler.
  details:
    - A Runner decides how nox run path/to/file launches one source file.
    - It can invoke a runtime, compile a temporary executable, or report that direct execution is not implemented.
  examples:
    - nox run examples/python/Test.py
    - nox run examples/c/Test.c -- one two
  links:
    - label: Explore Runners
      href: /runners

Runners:
  summary: The direct-file execution handlers used by nox run.
  details:
    - Runtime handlers cover F#, Python, JavaScript, and Ruby.
    - Compile handlers cover C, C++, Haskell, and D through temporary artifacts.
  examples:
    - nox run examples/javascript/arrays.js
    - nox run examples/d/arrays.d
  links:
    - label: Explore Runners
      href: /runners

nox init:
  summary: Bootstrap a Nox project from a directory.
  details:
    - Analyzes languages, manifests, source files, tests, Git, Nix, formatters, and existing Nox files.
    - Writes only missing files, preserving existing project configuration.
    - Empty projects receive a language-aware source file and matching ecosystem files.
  examples:
    - nox init my-project --language rust --type executable
    - nox init --language c --formatter --no-nix
  links:
    - label: Read the init guide
      href: /init
    - label: Read CLI options
      href: /docs/commands

NOML:
  summary: Nox's Object Modeling Language and standalone parser crate.
  details:
    - Nox uses NOML for embedded command, language, and initialization rules.
    - The standalone noml project exposes parsing, serialization, checking, and formatting through Rust APIs and CLI binaries.
  examples:
    - cd noml && cargo run -- parse demo.noml
    - cd noml && cargo run --bin nomlfmt -- demo.noml
  links:
    - label: Read the NOML reference
      href: /docs/noml

--name:
  summary: Set the project name used by nox init.
  details:
    - Takes one project-name value.
    - Without it, init derives a name from the selected directory or detected package metadata.
  examples:
    - nox init --name my-tool
  links:
    - label: Read init options
      href: /docs/commands

--language:
  summary: Select the language used by nox init.
  details:
    - Takes one language value and bypasses language detection.
    - The value selects language-specific source, target, formatter, and ecosystem templates when available.
  examples:
    - nox init --language rust
    - nox init --language cpp
  links:
    - label: Read init options
      href: /docs/commands

--type:
  summary: Select the project type used by nox init.
  details:
    - Takes a project type such as executable or library.
    - When omitted, init infers the type from project contents and detected files.
  examples:
    - nox init --type executable
  links:
    - label: Read init options
      href: /docs/commands

--template:
  summary: Select an init template by name.
  details:
    - Takes one template name.
    - The option is accepted by the CLI, but template generation is not currently implemented.
  examples:
    - nox init --template cli
  links:
    - label: Read init options
      href: /docs/commands

--formatter:
  summary: Request formatter configuration during initialization.
  details:
    - Init creates supported formatter configuration when the language rules provide one.
    - Existing formatter files are never overwritten.
  examples:
    - nox init --formatter
  links:
    - label: Read init options
      href: /docs/commands

--no-noxfile:
  summary: Disable noxfile creation during initialization.
  details:
    - This only affects files created by nox init.
    - Existing noxfile files remain untouched.
  examples:
    - nox init --no-noxfile
  links:
    - label: Read init options
      href: /docs/commands

--no-nix:
  summary: Disable Nix file creation during initialization.
  details:
    - This prevents init from creating flake.nix and related Nix setup files.
    - Existing Nix files remain untouched.
  examples:
    - nox init --no-nix
  links:
    - label: Read init options
      href: /docs/commands

--help:
  summary: Show general or command-specific help.
  details:
    - Place it after a command to show that command's usage, options, and behavior.
    - With no command, it shows the general Nox command list.
  examples:
    - nox --help
    - nox build --help
  links:
    - label: Read the command reference
      href: /docs/commands

--version:
  summary: Print the embedded Nox version.
  details:
    - The long form is equivalent to -v and -V.
    - At the first argument position it takes precedence over command parsing.
  examples:
    - nox --version
  links:
    - label: Read the command reference
      href: /docs/commands

--build-dir:
  summary: Select the build state and artifact directory.
  details:
    - Takes a path and is also available as the -C short form.
    - When omitted, Nox uses nox.config or the default build directory according to the command.
  examples:
    - nox build --build-dir out
    - nox stat -C build
  links:
    - label: Read path and state behavior
      href: /docs/commands

--release:
  summary: Select the release configuration.
  details:
    - Setup and rebuild store release as the selected configuration.
    - Run checks its configured state against the requested configuration.
  examples:
    - nox setup --release
    - nox rebuild --release
  links:
    - label: Read configuration behavior
      href: /docs/commands

--debug:
  summary: Select the debug configuration.
  details:
    - Debug is the default configuration when no configuration flag is supplied.
    - It is the counterpart to --release for setup, rebuild, install, and run checks.
  examples:
    - nox setup --debug
  links:
    - label: Read configuration behavior
      href: /docs/commands

--reconfigure:
  summary: Recreate the selected build state.
  details:
    - For setup, removes the selected build directory before detecting tools and writing fresh nox.state.
    - On commands that do not reconfigure, the flag is accepted but has no command-specific effect.
  examples:
    - nox setup --reconfigure
  links:
    - label: Read setup behavior
      href: /docs/commands

--compile-flag:
  summary: Add a compiler flag to a build.
  details:
    - Takes one flag value and can be repeated.
    - Setup stores the flags in nox.state; build appends them for its invocation.
  examples:
    - nox setup --compile-flag -Wall --compile-flag -Wextra
  links:
    - label: Read build options
      href: /docs/commands

--prefix:
  summary: Select the installation prefix.
  details:
    - Takes a path used by install and uninstall.
    - Relative paths resolve from the project root; the Unix default is /usr/local.
  examples:
    - nox install --prefix "$HOME/.local"
    - nox uninstall --prefix "$HOME/.local"
  links:
    - label: Read installation commands
      href: /docs/commands

nox run:
  summary: Build and run a target or execute one source file.
  details:
    - Directories run the project, existing files use the Runner registry, and other values are treated as target names.
    - Everything after -- is forwarded to the child process.
    - A child process exit code is preserved; signal termination becomes 1.
  examples:
    - nox run
    - nox run hello -- --verbose
    - nox run examples/python/arguments.py -- one two
  links:
    - label: Read Runner behavior
      href: /runners
    - label: Read the command reference
      href: /docs/commands

nox setup:
  summary: Configure a project without compiling it.
  details:
    - Parses and validates nox.build, detects the C compiler, linker, and archiver, and writes build/nox.state.
    - Debug is the default configuration; --release selects release configuration.
  examples:
    - nox setup build
    - nox setup out --release --reconfigure
  links:
    - label: Read the build reference
      href: /build
    - label: Read CLI behavior
      href: /docs/commands

nox build:
  summary: Compile changed sources and link targets.
  details:
    - Loads configured state, validates the graph, compiles changed sources, and processes targets in dependency order.
    - C and C++ sources use incremental objects and compiler-generated dependency files.
  examples:
    - nox build
    - nox build -C build -j8
  links:
    - label: Read the build reference
      href: /build
    - label: Read CLI behavior
      href: /docs/commands

nox install:
  summary: Build and copy install-marked artifacts into a prefix.
  details:
    - Executables go to prefix/bin; static and shared libraries go to prefix/lib.
    - The default Unix prefix is /usr/local, while --prefix selects another location.
  examples:
    - nox install
    - nox install --release --prefix "$HOME/.local"
  links:
    - label: Read installation commands
      href: /docs/commands

executable:
  summary: A target kind that produces a runnable program.
  details:
    - Generic executable targets select a language backend from their source extension.
    - C and C++ executables are compiled and linked through the native toolchain path.
  examples:
    - executable "hello" { sources = ["src/main.c"] install = true }
  links:
    - label: Read target declarations
      href: /build

sources:
  summary: The project-relative files that make up a target.
  details:
    - Every target needs at least one source.
    - Sources can be listed explicitly or expanded with a simple glob expression.
  examples:
    - sources = ["src/main.c", "src/print.c"]
    - sources = glob("src/*.c")
  links:
    - label: Read source properties
      href: /build

dependencies:
  summary: Other targets that must be built first.
  details:
    - Dependencies must name targets declared in the same project.
    - Nox rejects missing dependencies and cycles before compiling, then links libraries in dependency order.
  examples:
    - dependencies = ["support"]
    - nox graph
  links:
    - label: Read dependency behavior
      href: /build

include_dirs:
  summary: Header search directories passed to the compiler.
  details:
    - Each directory becomes a compiler -I argument for the target.
  examples:
    - include_dirs = ["include", "third_party/include"]
  links:
    - label: Read target properties
      href: /build

defines:
  summary: Preprocessor definitions passed to the compiler.
  details:
    - Each value becomes a compiler -D definition for the target.
  examples:
    - defines = ["NDEBUG", "PROJECT_VERSION=2"]
  links:
    - label: Read target properties
      href: /build

flags:
  summary: Additional compiler or Rider flags.
  details:
    - Flags are appended to the language-specific build command for a target.
    - Global compile flags can also be supplied with --compile-flag.
  examples:
    - flags = ["-Wall", "-Wextra"]
    - nox build --compile-flag -O2
  links:
    - label: Read target properties
      href: /build

install:
  summary: A boolean target property that marks an artifact for installation.
  details:
    - Installable executables go to prefix/bin, while libraries go to prefix/lib.
    - Existing destination files are overwritten during installation.
  examples:
    - install = true
    - nox install --prefix "$HOME/.local"
  links:
    - label: Read installation commands
      href: /docs/commands

nox.state:
  summary: Generated configuration state for a build directory.
  details:
    - Stores the project root, build directory, configuration, detected compiler, linker, archiver, and compile flags.
    - Build, run, status, and install use this state when selecting configured output.
  examples:
    - build/nox.state
    - nox status
  links:
    - label: Read setup behavior
      href: /docs/commands

nox.config:
  summary: Generated project configuration that remembers a build directory.
  details:
    - Commands use the remembered directory when no explicit -C or --build-dir value is supplied.
    - clean removes it when no explicit build directory was selected.
  examples:
    - nox.config
    - nox status
  links:
    - label: Read CLI path rules
      href: /docs/commands

VERSION:
  summary: The project version file used by Nox.
  details:
    - version and bump-version read this file from the project root.
    - bump-version always updates VERSION and can update configured or discovered references.
  examples:
    - 1.1.6
    - nox bump-version minor
  links:
    - label: Read version commands
      href: /docs/commands

glob:
  summary: A simple source-pattern function.
  details:
    - The current implementation supports one asterisk and reads one directory.
    - Recursive ** patterns, brace patterns, and multiple glob expressions are not implemented.
  examples:
    - sources = glob("src/*.c")
  links:
    - label: Read source patterns
      href: /build

--:
  summary: The argument separator for nox run.
  details:
    - Nox stops parsing its own options at -- and forwards every remaining value to the child process.
  examples:
    - nox run examples/python/arguments.py -- red green blue
  links:
    - label: Read run arguments
      href: /docs/commands

NoxIDE:
  summary: The graphical Rust editor for Nox projects.
  details:
    - Provides file-backed editing, an explorer, tabs, output, and graphical Open and Save actions.
    - Delegates configure, build, run, and other project actions to the nox executable.
  examples:
    - build/debug/noxide/noxide src/main.rs
  links:
    - label: Read the NoxIDE guide
      href: /docs/noxide

Noxical:
  summary: The Rust lexical analyzer used for Nox syntax tooling.
  details:
    - Produces typed tokens with byte spans, line and column positions, and structured lexical errors.
    - Its public API is centered on Lexer::new(source).tokenize().
  examples:
    - cargo test -p noxical
  links:
    - label: Read the Noxical guide
      href: /docs/noxical

architecture:
  summary: The boundaries between Nox parsing, graph validation, tools, and actions.
  details:
    - Nox keeps language-specific behavior in toolchain and executor boundaries while the graph remains language agnostic.
  examples:
    - nox validate
    - nox setup build
  links:
    - label: Read the architecture guide
      href: /docs/architecture

toolchains:
  summary: The compiler, linker, archiver, and runtime programs Nox detects.
  details:
    - Native C and C++ tools are detected during setup; Rider-specific tools are checked when needed.
  examples:
    - nox status
  links:
    - label: Read the toolchain guide
      href: /docs/toolchains

workflows:
  summary: Repeatable project loops for initializing, building, running, testing, and releasing.
  details:
    - Workflows combine Nox commands without changing the underlying build graph.
  examples:
    - nox init hello --language c
    - nox build -j8
  links:
    - label: Read the workflow guide
      href: /docs/workflows

testing:
  summary: The checks and integration practices used to develop Nox.
  details:
    - Tests cover parser behavior, graph validation, handlers, temporary artifacts, and real external project workflows.
  examples:
    - cargo test --all-targets
    - nix flake check
  links:
    - label: Read the testing guide
      href: /docs/testing

_nox_definition: &nox_definition
  summary: The Nox command-line build system and task runner.
  details:
    - Nox reads nox.build, validates a dependency graph, detects toolchains, and executes builds, runs, installs, and tasks.
    - The nox executable always operates from the current project root unless a configured build state points elsewhere.
  examples:
    - nox help
    - nox setup build
  links:
    - label: Read the full Docs hub
      href: /docs

nox: *nox_definition

_target_definition: &target_definition
  summary: A named build artifact in the Nox project graph.
  details:
    - Targets declare a kind, source files, dependencies, flags, and optional installation behavior.
    - Target names are unique within a project and form the dependency graph that Nox orders before building.
  examples:
    - executable "app" { sources = ["src/main.c"] }
    - nox targets
  links:
    - label: Read target declarations
      href: /build

