nox.build:
  summary: The declarative project file for Nox.
  details:
    - Defines project metadata, settings, targets, source files, compiler flags, dependencies, and install behavior.
    - It is intentionally separate from noxfile, which is for task automation rather than the compilation graph.
  examples:
    - project "hello" { executable "hello" { sources = ["src/main.c"] } }
    - nox validate
  links:
    - label: Read the nox.build reference
      href: /build
    - label: See the full documentation
      href: /docs

noxfile:
  summary: The optional task-automation file.
  details:
    - Defines named tasks such as format, check, build, and test.
    - Tasks can run shell commands, call other tasks with @nox, and interpolate project values.
  examples:
    - nox task format
    - nox tasks
  links:
    - label: Read the noxfile reference
      href: /tasks

Rider:
  summary: A language and toolchain backend used to build project targets.
  details:
    - Riders map source extensions to compilers, linkers, runtimes, or packaging actions.
    - The build graph stays language agnostic while each Rider owns language-specific tool behavior.
  examples:
    - executable "tool" { sources = ["main.go"] }
    - nox riders
  links:
    - label: Explore Riders
      href: /riders

Riders:
  summary: Nox's built-in language build backends.
  details:
    - The catalog includes C, C++, Rust, Haskell, D, Go, Java, C#, Swift, Zig, Python, JavaScript, TypeScript, and Kotlin.
    - Missing external tools are reported when the relevant target needs to build.
  examples:
    - nox riders
  links:
    - label: Explore Riders
      href: /riders

Runner:
  summary: A direct-file execution handler.
  details:
    - A Runner decides how nox run path/to/file launches one source file.
    - It can invoke a runtime, compile a temporary executable, or report that direct execution is not implemented.
  examples:
    - nox run examples/python/Test.py
    - nox run examples/c/Test.c -- one two
  links:
    - label: Explore Runners
      href: /runners

Runners:
  summary: The direct-file execution handlers used by nox run.
  details:
    - Runtime handlers cover F#, Python, JavaScript, and Ruby.
    - Compile handlers cover C, C++, Haskell, and D through temporary artifacts.
  examples:
    - nox run examples/javascript/arrays.js
    - nox run examples/d/arrays.d
  links:
    - label: Explore Runners
      href: /runners

nox init:
  summary: Bootstrap a Nox project from a directory.
  details:
    - Analyzes languages, manifests, source files, tests, Git, Nix, formatters, and existing Nox files.
    - Writes only missing files, preserving existing project configuration.
    - Empty projects receive a language-aware source file and matching ecosystem files.
  examples:
    - nox init my-project --language rust --type executable
    - nox init --language c --formatter --no-nix
  links:
    - label: Read the init guide
      href: /init
    - label: Read CLI options
      href: /docs/commands

NOML:
  summary: Nox's Object Modeling Language and standalone parser crate.
  details:
    - Nox uses NOML for embedded command, language, and initialization rules.
    - The standalone noml project exposes parsing, serialization, checking, and formatting through Rust APIs and CLI binaries.
  examples:
    - cd noml && cargo run -- parse demo.noml
    - cd noml && cargo run --bin nomlfmt -- demo.noml
  links:
    - label: Read the NOML reference
      href: /docs/noml

--name:
  summary: Set the project name used by nox init.
  details:
    - Takes one project-name value.
    - Without it, init derives a name from the selected directory or detected package metadata.
  examples:
    - nox init --name my-tool
  links:
    - label: Read init options
      href: /docs/commands

-h:
  summary: Show help for the selected command.
  details:
    - Use -h after a command to open that command's usage and option reference.
    - Bare -h is equivalent to general nox help.
  examples:
    - nox build -h
  links:
    - label: Read the command reference
      href: /docs/commands

-v, -V:
  summary: Print the embedded Nox version.
  details:
    - Both short forms are aliases for --version.
    - At the first argument position they take precedence over command parsing.
  examples:
    - nox -v
    - nox -V
  links:
    - label: Read the command reference
      href: /docs/commands

-v:
  summary: Print the embedded Nox version.
  details:
    - -v is a short form of --version.
    - It exits without dispatching another command.
  examples:
    - nox -v
  links:
    - label: Read the command reference
      href: /docs/commands

-V:
  summary: Print the embedded Nox version.
  details:
    - -V is a short form of --version.
    - It exits without dispatching another command.
  examples:
    - nox -V
  links:
    - label: Read the command reference
      href: /docs/commands

-C:
  summary: Select the build directory.
  details:
    - -C takes one path and is the short form of --build-dir.
    - The selected directory contains nox.state and configuration-specific artifacts.
  examples:
    - nox build -C out
    - nox stat -C build
  links:
    - label: Read path and state behavior
      href: /docs/commands

-j:
  summary: Set the number of build workers.
  details:
    - -j takes a separate positive integer value.
    - The requested worker count is used for parallel source compilation and is clamped to at least one worker.
  examples:
    - nox build -j 8
  links:
    - label: Read build options
      href: /docs/commands

-jN:
  summary: Set the number of build workers using the attached short form.
  details:
    - Replace N with a positive integer, such as -j8.
    - This is equivalent to writing -j 8 and controls parallel source compilation.
  examples:
    - nox build -j8
  links:
    - label: Read build options
      href: /docs/commands

--language:
  summary: Select the language used by nox init.
  details:
    - Takes one language value and bypasses language detection.
    - The value selects language-specific source, target, formatter, and ecosystem templates when available.
  examples:
    - nox init --language rust
    - nox init --language cpp
  links:
    - label: Read init options
      href: /docs/commands

--type:
  summary: Select the project type used by nox init.
  details:
    - Takes a project type such as executable or library.
    - When omitted, init infers the type from project contents and detected files.
  examples:
    - nox init --type executable
  links:
    - label: Read init options
      href: /docs/commands

--template:
  summary: Select an init template by name.
  details:
    - Takes one template name.
    - The option is accepted by the CLI, but template generation is not currently implemented.
  examples:
    - nox init --template cli
  links:
    - label: Read init options
      href: /docs/commands

--formatter:
  summary: Request formatter configuration during initialization.
  details:
    - Init creates supported formatter configuration when the language rules provide one.
    - Existing formatter files are never overwritten.
  examples:
    - nox init --formatter
  links:
    - label: Read init options
      href: /docs/commands

--no-noxfile:
  summary: Disable noxfile creation during initialization.
  details:
    - This only affects files created by nox init.
    - Existing noxfile files remain untouched.
  examples:
    - nox init --no-noxfile
  links:
    - label: Read init options
      href: /docs/commands

--no-nix:
  summary: Disable Nix file creation during initialization.
  details:
    - This prevents init from creating flake.nix and related Nix setup files.
    - Existing Nix files remain untouched.
  examples:
    - nox init --no-nix
  links:
    - label: Read init options
      href: /docs/commands

--help:
  summary: Show general or command-specific help.
  details:
    - Place it after a command to show that command's usage, options, and behavior.
    - With no command, it shows the general Nox command list.
  examples:
    - nox --help
    - nox build --help
  links:
    - label: Read the command reference
      href: /docs/commands

--version:
  summary: Print the embedded Nox version.
  details:
    - The long form is equivalent to -v and -V.
    - At the first argument position it takes precedence over command parsing.
  examples:
    - nox --version
  links:
    - label: Read the command reference
      href: /docs/commands

--build-dir:
  summary: Select the build state and artifact directory.
  details:
    - Takes a path and is also available as the -C short form.
    - When omitted, Nox uses nox.config or the default build directory according to the command.
  examples:
    - nox build --build-dir out
    - nox stat -C build
  links:
    - label: Read path and state behavior
      href: /docs/commands

--release:
  summary: Select the release configuration.
  details:
    - Setup and rebuild store release as the selected configuration.
    - Run checks its configured state against the requested configuration.
  examples:
    - nox setup --release
    - nox rebuild --release
  links:
    - label: Read configuration behavior
      href: /docs/commands

--debug:
  summary: Select the debug configuration.
  details:
    - Debug is the default configuration when no configuration flag is supplied.
    - It is the counterpart to --release for setup, rebuild, install, and run checks.
  examples:
    - nox setup --debug
  links:
    - label: Read configuration behavior
      href: /docs/commands

--reconfigure:
  summary: Recreate the selected build state.
  details:
    - For setup, removes the selected build directory before detecting tools and writing fresh nox.state.
    - On commands that do not reconfigure, the flag is accepted but has no command-specific effect.
  examples:
    - nox setup --reconfigure
  links:
    - label: Read setup behavior
      href: /docs/commands

--compile-flag:
  summary: Add a compiler flag to a build.
  details:
    - Takes one flag value and can be repeated.
    - Setup stores the flags in nox.state; build appends them for its invocation.
  examples:
    - nox setup --compile-flag -Wall --compile-flag -Wextra
  links:
    - label: Read build options
      href: /docs/commands

--prefix:
  summary: Select the installation prefix.
  details:
    - Takes a path used by install and uninstall.
    - Relative paths resolve from the project root; the Unix default is /usr/local.
  examples:
    - nox install --prefix "$HOME/.local"
    - nox uninstall --prefix "$HOME/.local"
  links:
    - label: Read installation commands
      href: /docs/commands

nox run:
  summary: Build and run a target or execute one source file.
  details:
    - Directories run the project, existing files use the Runner registry, and other values are treated as target names.
    - Everything after -- is forwarded to the child process.
    - A child process exit code is preserved; signal termination becomes 1.
  examples:
    - nox run
    - nox run hello -- --verbose
    - nox run examples/python/arguments.py -- one two
  links:
    - label: Read Runner behavior
      href: /runners
    - label: Read the command reference
      href: /docs/commands

nox nomlfmt:
  summary: Format one NOML file or every NOML file under a directory.
  details:
    - An explicit file is formatted in place.
    - A directory is searched recursively for .noml files while generated .git, target, and build directories are skipped.
    - The command does not require nox setup or a project build state.
  examples:
    - nox nomlfmt rules.noml
    - nox nomlfmt .
  links:
    - label: Read the command reference
      href: /docs/commands

nox setup:
  summary: Configure a project without compiling it.
  details:
    - Parses and validates nox.build, detects the C compiler, linker, and archiver, and writes build/nox.state.
    - Debug is the default configuration; --release selects release configuration.
  examples:
    - nox setup build
    - nox setup out --release --reconfigure
  links:
    - label: Read the build reference
      href: /build
    - label: Read CLI behavior
      href: /docs/commands

nox build:
  summary: Compile changed sources and link targets.
  details:
    - Loads configured state, validates the graph, compiles changed sources, and processes targets in dependency order.
    - C and C++ sources use incremental objects and compiler-generated dependency files.
  examples:
    - nox build
    - nox build -C build -j8
  links:
    - label: Read the build reference
      href: /build
    - label: Read CLI behavior
      href: /docs/commands

nox install:
  summary: Build and copy install-marked artifacts into a prefix.
  details:
    - Executables go to prefix/bin; static and shared libraries go to prefix/lib.
    - The default Unix prefix is /usr/local, while --prefix selects another location.
  examples:
    - nox install
    - nox install --release --prefix "$HOME/.local"
  links:
    - label: Read installation commands
      href: /docs/commands

executable:
  summary: A target kind that produces a runnable program.
  details:
    - Generic executable targets select a language backend from their source extension.
    - C and C++ executables are compiled and linked through the native toolchain path.
  examples:
    - executable "hello" { sources = ["src/main.c"] install = true }
  links:
    - label: Read target declarations
      href: /build

sources:
  summary: The project-relative files that make up a target.
  details:
    - Every target needs at least one source.
    - Sources can be listed explicitly or expanded with a simple glob expression.
  examples:
    - sources = ["src/main.c", "src/print.c"]
    - sources = glob("src/*.c")
  links:
    - label: Read source properties
      href: /build

dependencies:
  summary: Other targets that must be built first.
  details:
    - Dependencies must name targets declared in the same project.
    - Nox rejects missing dependencies and cycles before compiling, then links libraries in dependency order.
  examples:
    - dependencies = ["support"]
    - nox graph
  links:
    - label: Read dependency behavior
      href: /build

include_dirs:
  summary: Header search directories passed to the compiler.
  details:
    - Each directory becomes a compiler -I argument for the target.
  examples:
    - include_dirs = ["include", "third_party/include"]
  links:
    - label: Read target properties
      href: /build

defines:
  summary: Preprocessor definitions passed to the compiler.
  details:
    - Each value becomes a compiler -D definition for the target.
  examples:
    - defines = ["NDEBUG", "PROJECT_VERSION=2"]
  links:
    - label: Read target properties
      href: /build

flags:
  summary: Additional compiler or Rider flags.
  details:
    - Flags are appended to the language-specific build command for a target.
    - Global compile flags can also be supplied with --compile-flag.
  examples:
    - flags = ["-Wall", "-Wextra"]
    - nox build --compile-flag -O2
  links:
    - label: Read target properties
      href: /build

install:
  summary: A boolean target property that marks an artifact for installation.
  details:
    - Installable executables go to prefix/bin, while libraries go to prefix/lib.
    - Existing destination files are overwritten during installation.
  examples:
    - install = true
    - nox install --prefix "$HOME/.local"
  links:
    - label: Read installation commands
      href: /docs/commands

nox.state:
  summary: Generated configuration state for a build directory.
  details:
    - Stores the project root, build directory, configuration, detected compiler, linker, archiver, and compile flags.
    - Build, run, status, and install use this state when selecting configured output.
  examples:
    - build/nox.state
    - nox status
  links:
    - label: Read setup behavior
      href: /docs/commands

nox.config:
  summary: Generated project configuration that remembers a build directory.
  details:
    - Commands use the remembered directory when no explicit -C or --build-dir value is supplied.
    - clean removes it when no explicit build directory was selected.
  examples:
    - nox.config
    - nox status
  links:
    - label: Read CLI path rules
      href: /docs/commands

VERSION:
  summary: The project version file used by Nox.
  details:
    - version and bump-version read this file from the project root.
    - bump-version always updates VERSION and can update configured or discovered references.
  examples:
    - 1.1.6
    - nox bump-version minor
  links:
    - label: Read version commands
      href: /docs/commands

glob:
  summary: A simple source-pattern function.
  details:
    - The current implementation supports one asterisk and reads one directory.
    - Recursive ** patterns, brace patterns, and multiple glob expressions are not implemented.
  examples:
    - sources = glob("src/*.c")
  links:
    - label: Read source patterns
      href: /build

--:
  summary: The argument separator for nox run.
  details:
    - Nox stops parsing its own options at -- and forwards every remaining value to the child process.
  examples:
    - nox run examples/python/arguments.py -- red green blue
  links:
    - label: Read run arguments
      href: /docs/commands

NoxIDE:
  summary: The graphical Rust editor for Nox projects.
  details:
    - Provides file-backed editing, an explorer, tabs, output, and graphical Open and Save actions.
    - Delegates configure, build, run, and other project actions to the nox executable.
  examples:
    - build/debug/noxide/noxide src/main.rs
  links:
    - label: Read the NoxIDE guide
      href: /docs/noxide

Noxical:
  summary: The Rust lexical analyzer used for Nox syntax tooling.
  details:
    - Produces typed tokens with byte spans, line and column positions, and structured lexical errors.
    - Its public API is centered on Lexer::new(source).tokenize().
  examples:
    - cargo test -p noxical
  links:
    - label: Read the Noxical guide
      href: /docs/noxical

architecture:
  summary: The boundaries between Nox parsing, graph validation, tools, and actions.
  details:
    - Nox keeps language-specific behavior in toolchain and executor boundaries while the graph remains language agnostic.
  examples:
    - nox validate
    - nox setup build
  links:
    - label: Read the architecture guide
      href: /docs/architecture

toolchains:
  summary: The compiler, linker, archiver, and runtime programs Nox detects.
  details:
    - Native C and C++ tools are detected during setup; Rider-specific tools are checked when needed.
  examples:
    - nox status
  links:
    - label: Read the toolchain guide
      href: /docs/toolchains

workflows:
  summary: Repeatable project loops for initializing, building, running, testing, and releasing.
  details:
    - Workflows combine Nox commands without changing the underlying build graph.
  examples:
    - nox init hello --language c
    - nox build -j8
  links:
    - label: Read the workflow guide
      href: /docs/workflows

testing:
  summary: The checks and integration practices used to develop Nox.
  details:
    - Tests cover parser behavior, graph validation, handlers, temporary artifacts, and real external project workflows.
  examples:
    - cargo test --all-targets
    - nix flake check
  links:
    - label: Read the testing guide
      href: /docs/testing

_nox_definition: &nox_definition
  summary: The Nox command-line build system and task runner.
  details:
    - Nox reads nox.build, validates a dependency graph, detects toolchains, and executes builds, runs, installs, and tasks.
    - The nox executable always operates from the current project root unless a configured build state points elsewhere.
  examples:
    - nox help
    - nox setup build
  links:
    - label: Read the full Docs hub
      href: /docs

nox: *nox_definition

_target_definition: &target_definition
  summary: A named build artifact in the Nox project graph.
  details:
    - Targets declare a kind, source files, dependencies, flags, and optional installation behavior.
    - Target names are unique within a project and form the dependency graph that Nox orders before building.
  examples:
    - executable "app" { sources = ["src/main.c"] }
    - nox targets
  links:
    - label: Read target declarations
      href: /build


_cli_definition: &cli_definition
  summary: A Nox command, alias, or command-line option.
  details:
    - CLI values select project operations, build directories, configurations, tool flags, output, or forwarded child arguments.
    - Every command accepts --help; command-specific behavior is documented in the CLI reference.
  examples:
    - nox help build
    - nox build --release
  links:
    - label: Read the CLI reference
      href: /docs/commands


_syntax_definition: &syntax_definition
  summary: A piece of Nox project or task syntax.
  details:
    - Syntax terms are interpreted by the nox.build or noxfile parser and are not shell commands by themselves.
    - Their accepted values and scope are defined by the project-file and task references.
  examples:
    - project "app" { }
    - 'tasks: format: run: cargo fmt --all'
  links:
    - label: Read the nox.build reference
      href: /build
    - label: Read the noxfile reference
      href: /tasks

":=": *syntax_definition
"@": *syntax_definition
"@nox clean + @nox build": *syntax_definition
"NAME := VALUE": *syntax_definition
"set NAME := VALUE": *syntax_definition
let: *syntax_definition
"task test": *syntax_definition
"glob(\"src/*.c\")": *syntax_definition
"glob(...)": *syntax_definition

_tool_definition: &tool_definition
  summary: An external compiler, linker, archiver, runtime, or tool used by Nox.
  details:
    - Nox looks up tools through PATH and reports a missing dependency when the relevant action needs it.
    - The selected executable is passed argument vectors by the build executor or Runner backend.
  examples:
    - nox status
    - nox riders
  links:
    - label: Read toolchain detection
      href: /docs/toolchains

"-D": *tool_definition
"-I": *tool_definition
"C": *tool_definition
"C#": *tool_definition
"C++": *tool_definition
"Command": *tool_definition
"Compile": *tool_definition
"D": *tool_definition
"Go": *tool_definition
"Haskell": *tool_definition
"Java": *tool_definition
"JavaScript": *tool_definition
"Kotlin": *tool_definition
"Python": *tool_definition
"Python / JavaScript": *tool_definition
"Registered, not implemented": *tool_definition
"Runtime": *tool_definition
"Rust": *tool_definition
"Swift": *tool_definition
"Swift / Zig": *tool_definition
"TypeScript": *tool_definition
"TypeScript / Kotlin": *tool_definition
"Zig": *tool_definition
ar: *tool_definition
"c++": *tool_definition
cc: *tool_definition
clang: *tool_definition
clang++: *tool_definition
g++: *tool_definition
gcc: *tool_definition
llvm-ar: *tool_definition
rustc: *tool_definition
"cargo check": *tool_definition
"cargo fmt --all": *tool_definition

_file_definition: &file_definition
  summary: A project, build, or environment file used by Nox.
  details:
    - File names influence project discovery, configuration state, task behavior, installation, or development environments.
  examples:
    - nox status
    - nix develop
  links:
    - label: Read the project workflow
      href: /docs/workflows

".git": *file_definition
".gitignore": *file_definition
"/usr/local/bin": *file_definition
"flake.nix": *file_definition
"~/.local/bin": *file_definition
"windows-shell": *file_definition
"cmd /C": *file_definition
"sh -c": *file_definition
"nox:": *file_definition
NO_COLOR: *file_definition
PATH: *file_definition

_api_definition: &api_definition
  summary: A public Noxical lexer API type or method.
  details:
    - Noxical exposes typed tokens, source positions, byte spans, and structured lexical errors for Nox syntax tooling.
    - API names are Rust symbols exported from the noxical library crate.
  examples:
    - Lexer::new(source).tokenize()
    - token.span.byte_range()
  links:
    - label: Read the Noxical guide
      href: /docs/noxical

Lexer: *api_definition
Token: *api_definition
TokenKind: *api_definition
Span: *api_definition
Position: *api_definition
LexError: *api_definition
LexErrorKind: *api_definition
"byte_range()": *api_definition

# Concrete reference entries live last so they intentionally replace earlier
# broad aliases. Inline code should describe the exact thing the reader clicked.
nox:
  summary: The Nox executable.
  details:
    - Nox reads commands and options from the current working directory. Project commands require a nox.build in that directory; Nox does not search parent directories for one.
    - Use nox help for the command list or nox help COMMAND for exact command usage.
  examples:
    - nox help
    - nox version
  links:
    - label: Open the command reference
      href: /docs/commands

"--build-dir PATH":
  summary: Choose the directory containing build state and artifacts.
  details:
    - PATH is stored as the build directory for setup, or used to locate an existing nox.state for build, run, status, install, and related commands.
    - This is the long form of -C. A positional BUILD_DIR supplied to setup, build, or compile takes precedence over this option.
  examples:
    - nox setup --build-dir out
    - nox build -C out
  links:
    - label: Read build-directory behavior
      href: /docs/commands

"--compile-flag FLAG":
  summary: Add one extra compiler argument.
  details:
    - FLAG is appended to compiler invocations. Repeat the option to provide more than one value.
    - During setup the values are written to nox.state. During build they are added only to that invocation after the stored values.
  examples:
    - nox setup build --compile-flag -Wall --compile-flag -Wextra
  links:
    - label: Read compiler and toolchain behavior
      href: /docs/toolchains

"--language LANG":
  summary: Tell nox init which language to scaffold.
  details:
    - LANG bypasses language detection and selects the language-specific starter source, target declaration, formatter, and ecosystem files when those rules exist.
    - It affects only initialization; it does not select a Rider for an existing target.
  examples:
    - nox init hello --language rust
  links:
    - label: Read project initialization
      href: /init

"--name NAME":
  summary: Set the project name generated by nox init.
  details:
    - NAME becomes the generated project name instead of a name inferred from the directory or package metadata.
    - This option only affects files that init creates; it does not rename existing declarations.
  examples:
    - nox init . --name command-line-tool
  links:
    - label: Read initialization options
      href: /init

"--type TYPE":
  summary: Select the kind of project generated by nox init.
  details:
    - TYPE is normally executable or library. When it is omitted, init infers the type from existing project files where possible.
    - The selection influences the generated target declaration and starter files.
  examples:
    - nox init mathlib --type library
  links:
    - label: Read initialization options
      href: /init

"--template NAME":
  summary: Reserve a named initialization template.
  details:
    - The CLI accepts NAME and records it in init options, but template-specific generation is not implemented in the current binary.
    - Use --language and --type for the currently implemented generation choices.
  examples:
    - nox init hello --template cli
  links:
    - label: Read initialization limits
      href: /init

"--prefix PATH":
  summary: Choose where install and uninstall place artifacts.
  details:
    - Executables marked install = true are copied to PATH/bin; libraries are copied to PATH/lib.
    - The Unix default is /usr/local. A user-owned prefix such as $HOME/.local avoids needing system write permission.
  examples:
    - nox install --prefix "$HOME/.local"
  links:
    - label: Read install behavior
      href: /docs/commands

"--release":
  summary: Select the release configuration.
  details:
    - setup and rebuild store release in nox.state and place artifacts under the release configuration directory.
    - build and run must agree with the configuration already stored in state; run setup or rebuild to change it.
  examples:
    - nox setup build --release
  links:
    - label: Read configuration behavior
      href: /docs/commands

"--debug":
  summary: Select the debug configuration.
  details:
    - Debug is the default configuration. setup and rebuild store it in nox.state and write artifacts under the debug directory.
    - For build and run, the requested mode must match the configured build state.
  examples:
    - nox rebuild --debug
  links:
    - label: Read configuration behavior
      href: /docs/commands

"--reconfigure":
  summary: Discard the selected build directory before setup.
  details:
    - With setup, Nox removes the selected build directory, redetects native tools, and writes a fresh nox.state.
    - Use it after changing the toolchain or build configuration; source-file edits only need a normal build.
  examples:
    - nox setup build --reconfigure
  links:
    - label: Read setup behavior
      href: /docs/commands

"--formatter":
  summary: Ask nox init to create supported formatter configuration.
  details:
    - Init adds formatter files only when the selected language has a formatter rule and the file does not already exist.
    - It never replaces an existing formatter configuration.
  examples:
    - nox init --language rust --formatter
  links:
    - label: Read initialization behavior
      href: /init

"--no-noxfile":
  summary: Do not generate a noxfile during initialization.
  details:
    - This disables only new noxfile creation by nox init. It does not delete or edit an existing noxfile.
  examples:
    - nox init hello --no-noxfile
  links:
    - label: Read task-file behavior
      href: /tasks

"--no-nix":
  summary: Do not generate Nix support files during initialization.
  details:
    - This prevents nox init from adding flake.nix and related generated Nix files.
    - Existing Nix files are preserved regardless of this option.
  examples:
    - nox init hello --no-nix
  links:
    - label: Read initialization behavior
      href: /init

"--help":
  summary: Print help for Nox or one command.
  details:
    - With no command, it prints the command list. After a command, it prints that command's usage and behavior.
    - -h is the equivalent short option.
  examples:
    - nox --help
    - nox run --help
  links:
    - label: Open the command reference
      href: /docs/commands

"--version":
  summary: Print Nox's embedded version and install channel.
  details:
    - The option exits before command dispatch. -v and -V are equivalent short forms.
  examples:
    - nox --version
  links:
    - label: Read version and update behavior
      href: /download

"--dev":
  summary: Update from Nox's development channel.
  details:
    - This is valid only with nox update. It selects the dev branch instead of the stable master branch.
    - It cannot be combined with --channel or --version.
  examples:
    - nox update --dev
  links:
    - label: Read update instructions
      href: /download

"--channel CHANNEL":
  summary: Choose the update channel.
  details:
    - This is valid only with nox update. CHANNEL must be stable or dev.
    - It cannot be combined with --dev or --version.
  examples:
    - nox update --channel stable
  links:
    - label: Read update instructions
      href: /download

"-C":
  summary: The short form of --build-dir PATH.
  details:
    - The following value selects the directory where Nox reads or writes nox.state and artifacts.
    - Use it when a project has more than one configured output directory.
  examples:
    - nox status -C build-release
  links:
    - label: Read build-directory behavior
      href: /docs/commands

"-j":
  summary: Set the number of parallel build workers.
  details:
    - The following positive integer controls parallel source compilation. If omitted, Nox uses the number of available CPU threads.
    - -j8 is the attached equivalent of -j 8.
  examples:
    - nox build -j 8
  links:
    - label: Read build behavior
      href: /docs/commands

"-jN":
  summary: Attached form of the parallel worker option.
  details:
    - Replace N with a positive integer. For example, -j8 requests eight build workers.
  examples:
    - nox build -j8
  links:
    - label: Read build behavior
      href: /docs/commands

"-h":
  summary: The short form of --help.
  details:
    - It prints general help when used alone or command-specific help when used after a command.
  examples:
    - nox build -h
  links:
    - label: Open the command reference
      href: /docs/commands

"-v":
  summary: The short form of --version.
  details:
    - It prints the embedded Nox version and exits before another command is run.
  examples:
    - nox -v
  links:
    - label: Read version and update behavior
      href: /download

"-V":
  summary: Another short form of --version.
  details:
    - It behaves exactly like -v and --version.
  examples:
    - nox -V
  links:
    - label: Read version and update behavior
      href: /download

nox clean:
  summary: Remove generated artifacts for one build directory.
  details:
    - Nox deletes the selected build directory when it exists. Installed artifacts under the chosen install prefix are left alone.
    - Without an explicit build directory, it also removes the project nox.config that remembers the previous directory.
  examples:
    - nox clean
    - nox clean -C out
  links:
    - label: Read clean behavior
      href: /docs/commands

nox rebuild:
  summary: Configure and build again from an empty output directory.
  details:
    - Nox removes the selected build directory, runs setup with the requested configuration and compile flags, then builds every target.
    - Use it when state or generated artifacts are stale; it intentionally does not preserve the old build outputs.
  examples:
    - nox rebuild --release -C build
  links:
    - label: Read rebuild behavior
      href: /docs/commands

nox validate:
  summary: Check a project graph without compiling it.
  details:
    - Nox parses nox.build and checks target declarations, source requirements, unknown dependencies, duplicate names, and dependency cycles.
    - It is the quickest way to validate a project-file edit before invoking compilers.
  examples:
    - nox validate
  links:
    - label: Read validation behavior
      href: /docs/commands

nox status:
  summary: Report configured project and toolchain state.
  details:
    - Status reads the selected nox.state and prints the root, build directory, configuration, detected native tools, compile flags, and target count.
    - If no state exists it reports that the build directory is not configured rather than compiling anything.
  examples:
    - nox status -C build
  links:
    - label: Read status behavior
      href: /docs/commands

nox targets:
  summary: List target names in declaration order.
  details:
    - The command parses nox.build and prints each target name. It does not require build state or run a compiler.
  examples:
    - nox targets
  links:
    - label: Read graph commands
      href: /docs/commands

nox graph:
  summary: Print the dependency order of project targets.
  details:
    - Dependencies appear before the targets that consume them. Missing dependencies and cycles are reported as errors.
  examples:
    - nox graph
  links:
    - label: Read graph commands
      href: /docs/commands

nox riders:
  summary: List language backends compiled into Nox.
  details:
    - A Rider selects a compiler, linker, runtime, or packaging path from a target's source language.
    - This command lists available Rider registrations; it does not verify that all external tools are installed.
  examples:
    - nox riders
  links:
    - label: Browse Rider behavior
      href: /riders

nox task:
  summary: Run one named task from noxfile.
  details:
    - Nox resolves task dependencies first, then runs each task command through sh -c on Unix or the configured Windows shell.
    - Task cycles and missing task names are errors. The task file is separate from the compilation graph.
  examples:
    - nox task format
  links:
    - label: Read the noxfile reference
      href: /tasks

nox tasks:
  summary: List task names declared in noxfile.
  details:
    - Nox parses the preferred tasks map or legacy task blocks, sorts names alphabetically, and prints them without running commands.
  examples:
    - nox tasks
  links:
    - label: Read the noxfile reference
      href: /tasks

nox test:
  summary: Run the task named test from noxfile.
  details:
    - This is a convenience command for nox task test. It does not discover a language-specific test framework on its own.
  examples:
    - nox test
  links:
    - label: Read task behavior
      href: /tasks

nox update:
  summary: Update an existing Nox installation through Cargo.
  details:
    - By default Nox checks the stable branch, compares semantic versions, and uses cargo install --force to replace the installed executable when a newer version exists.
    - --dev selects the development channel; --channel selects stable or dev; --version requests one exact newer release. Nix-managed installations print Nix-specific instructions instead.
  examples:
    - nox update
    - nox update --version 1.2.3
  links:
    - label: Read install and update instructions
      href: /download

nox version:
  summary: Print the installed Nox version and channel.
  details:
    - The command reads the version embedded at compile time and includes the install channel when it is available.
  examples:
    - nox version
  links:
    - label: Read install and update instructions
      href: /download

nox help:
  summary: Open Nox help.
  details:
    - With a command name, help prints its usage and behavior. Without one, it prints the top-level command list.
  examples:
    - nox help run
  links:
    - label: Open the command reference
      href: /docs/commands

nox uninstall:
  summary: Remove artifacts previously installed by a project.
  details:
    - Nox selects the configured project and prefix, then removes install-marked executable and library destinations without compiling first.
    - Use the same --prefix used during installation.
  examples:
    - nox uninstall --prefix "$HOME/.local"
  links:
    - label: Read installation behavior
      href: /docs/commands

nox bump-version:
  summary: Bump or set a project's version.
  details:
    - With major, minor, or patch it increments VERSION. With a semantic-version value it sets that value directly.
    - Nox updates VERSION and configured or discovered version references, then reports every changed file.
  examples:
    - nox bump-version minor
  links:
    - label: Read version commands
      href: /docs/commands

build:
  summary: The build command and its build-graph operation.
  details:
    - As nox build, it loads configured state, reparses nox.build, validates dependencies, compiles changed sources, and links targets in dependency order.
    - The alias compile has the same behavior; b is a shorter alias for build.
  examples:
    - nox build -C build -j8
  links:
    - label: Read build behavior
      href: /docs/commands

setup:
  summary: Configure a project without compiling its sources.
  details:
    - Setup parses nox.build, validates the graph, detects native C/C++ tools, and writes nox.state for the selected debug or release build directory.
  examples:
    - nox setup build
  links:
    - label: Read setup behavior
      href: /docs/commands

compile:
  summary: An alias for nox build.
  details:
    - It loads configured state and incrementally builds the project exactly as nox build does.
  examples:
    - nox compile -C build
  links:
    - label: Read build behavior
      href: /docs/commands

configure:
  summary: An alias for nox setup.
  details:
    - It configures a build directory without compiling sources.
  examples:
    - nox configure build --release
  links:
    - label: Read setup behavior
      href: /docs/commands

stat:
  summary: An alias for nox status.
  details:
    - It prints state and toolchain metadata for the selected build directory.
  examples:
    - nox stat -C build
  links:
    - label: Read status behavior
      href: /docs/commands

list:
  summary: An alias for nox targets.
  details:
    - It prints declared target names in their source-file order.
  examples:
    - nox list
  links:
    - label: Read graph commands
      href: /docs/commands

linker_flags:
  summary: Extra arguments passed while linking a target.
  details:
    - Each value is appended only to the target's linker invocation, unlike flags which apply while compiling sources.
    - Use this for library search paths or linker options required by that target.
  examples:
    - linker_flags = ["-lm"]
  links:
    - label: Read target properties
      href: /build

project:
  summary: A named project declaration in nox.build.
  details:
    - A project groups metadata, reusable bindings, environment variables, and one or more targets. A file may declare more than one project.
    - Multi-project commands that need one executable or install set require a project name instead of guessing.
  examples:
    - project "hello" { executable "hello" { sources = ["src/main.c"] } }
  links:
    - label: Read project declarations
      href: /build

version:
  summary: Project metadata that supplies a version string.
  details:
    - version accepts a literal, a file(...) value, or a reusable binding. Nox includes it in status and uses it for task interpolation.
  examples:
    - version = "1.0.0"
  links:
    - label: Read project metadata
      href: /build

version_files:
  summary: Files updated alongside VERSION by nox bump-version.
  details:
    - Each project-relative path is searched for the current version and rewritten to the new one during a version bump.
  examples:
    - version_files = ["Cargo.toml", "VERSION"]
  links:
    - label: Read version behavior
      href: /docs/commands

description:
  summary: Human-readable project description metadata.
  details:
    - Nox stores this string in the parsed project and prints it in status when it is present.
  examples:
    - description = "A command-line application"
  links:
    - label: Read project metadata
      href: /build

license:
  summary: Project license metadata.
  details:
    - license accepts a literal string or file(...) value. Status reports the resolved value.
  examples:
    - license = file("UNLICENSE")
  links:
    - label: Read project metadata
      href: /build

edition:
  summary: Project metadata with a default value of 1.
  details:
    - Nox records the value in the project model and displays it in status. It does not currently select a compiler edition or language standard.
  examples:
    - edition = "1"
  links:
    - label: Read project metadata
      href: /build

repository:
  summary: Source repository URL metadata.
  details:
    - Nox displays this string in status. It does not fetch or clone the repository during normal project operations.
  examples:
    - repository = "https://github.com/example/hello"
  links:
    - label: Read project metadata
      href: /build

website:
  summary: Project website URL metadata.
  details:
    - Nox displays this string in status. It does not contact the URL.
  examples:
    - website = "https://example.com"
  links:
    - label: Read project metadata
      href: /build

authors:
  summary: A list of project authors.
  details:
    - Nox stores and displays these strings as project metadata. They do not change compilation or installation behavior.
  examples:
    - authors = ["Ada", "Lin"]
  links:
    - label: Read project metadata
      href: /build

maintainers:
  summary: A list of current project maintainers.
  details:
    - Nox stores and displays these strings as project metadata. Contact details are conventional text, not parsed special values.
  examples:
    - maintainers = ["Ada <ada@example.com>"]
  links:
    - label: Read project metadata
      href: /build

extra.env:
  summary: Environment variables applied to Nox project commands.
  details:
    - Each key/value in the block is added to Nox's process environment after the project is parsed.
    - Use it for project-local tool behavior such as RUST_BACKTRACE; it is not a replacement for target compiler flags.
  examples:
    - extra.env { RUST_BACKTRACE = "full" }
  links:
    - label: Read project declarations
      href: /build

library.static:
  summary: A target that packages compiled objects into a static library.
  details:
    - Nox uses the configured archiver to create the library, then dependent native targets can link against it in graph order.
  examples:
    - library.static "support" { sources = ["src/support.c"] }
  links:
    - label: Read target kinds
      href: /build

library.shared:
  summary: A target that produces a shared library.
  details:
    - Nox compiles and links a platform shared library for the target's sources. Dependents are ordered after it in the graph.
  examples:
    - library.shared "support" { sources = ["src/support.c"] }
  links:
    - label: Read target kinds
      href: /build

library.rust:
  summary: A target that produces a Rust library with rustc.
  details:
    - Nox invokes rustc directly for this target rather than Cargo's package and dependency-resolution workflow.
  examples:
    - library.rust "support" { sources = ["src/lib.rs"] }
  links:
    - label: Read target kinds
      href: /build

"run:":
  summary: A noxfile task command entry.
  details:
    - "The value after run: is executed by the task shell. Repeating run: in one task executes commands in source order."
    - A block value introduced by | or > collects its indented lines into one shell command.
  examples:
    - "run: cargo test"
  links:
    - label: Read task syntax
      href: /tasks

"@nox":
  summary: A noxfile dependency on another Nox command or task.
  details:
    - If the referenced name is another task, Nox runs that task first. Otherwise it invokes the Nox executable with the referenced command and arguments.
  examples:
    - "@nox build"
  links:
    - label: Read task dependencies
      href: /tasks

"{{build_dir}}":
  summary: The selected build-directory interpolation in a noxfile task.
  details:
    - Nox replaces this placeholder with the build directory passed to the task before sending the command to the shell.
  examples:
    - "run: mkdir -p {{build_dir}}"
  links:
    - label: Read task interpolation
      href: /tasks

"{{version}}":
  summary: The project-version interpolation in a noxfile task.
  details:
    - Nox replaces this placeholder with the parsed project version, or Nox's own embedded version if no project file is present.
  examples:
    - "run: echo version={{version}}"
  links:
    - label: Read task interpolation
      href: /tasks

init:
  summary: Create missing Nox project files for a directory.
  details:
    - Nox analyzes the chosen directory, detects source languages and common ecosystem files, then writes only files that do not already exist.
    - It can create nox.build, noxfile, README, .gitignore, Nix files, and language-aware starter files.
  examples:
    - nox init hello --language c
  links:
    - label: Read project initialization
      href: /init

clean:
  summary: Remove generated output for a configured build directory.
  details:
    - It deletes build state and artifacts, but deliberately leaves files already installed under an install prefix.
  examples:
    - nox clean -C build
  links:
    - label: Read clean behavior
      href: /docs/commands

rebuild:
  summary: Reconfigure and build the entire project from scratch.
  details:
    - It removes the selected build directory, runs setup, then builds all targets with the selected configuration.
  examples:
    - nox rebuild --release
  links:
    - label: Read rebuild behavior
      href: /docs/commands

validate:
  summary: Check nox.build declarations without compiling.
  details:
    - It rejects invalid syntax, duplicate targets, missing dependencies, dependency cycles, and targets with no source files.
  examples:
    - nox validate
  links:
    - label: Read validation behavior
      href: /docs/commands

status:
  summary: Display the stored configuration and toolchain for a build directory.
  details:
    - It reads nox.state and reports project metadata, configuration, native tools, flags, and target count without invoking a build.
  examples:
    - nox status
  links:
    - label: Read status behavior
      href: /docs/commands

targets:
  summary: List target names declared in nox.build.
  details:
    - It prints declarations in source order and does not configure or compile the project.
  examples:
    - nox targets
  links:
    - label: Read graph commands
      href: /docs/commands

graph:
  summary: Print targets in dependency order.
  details:
    - A dependency appears before the target that consumes it, making this a quick way to inspect the build graph.
  examples:
    - nox graph
  links:
    - label: Read graph commands
      href: /docs/commands

riders:
  summary: List Nox's registered language backends.
  details:
    - Riders contain language-specific build behavior while Nox's project graph remains language-neutral.
  examples:
    - nox riders
  links:
    - label: Browse Riders
      href: /riders

run:
  summary: Build and execute a project target or run a supported source file.
  details:
    - With a target name, Nox builds the project and executes that executable artifact. With an existing file path, it selects a direct-file Runner.
    - Arguments after -- are forwarded untouched to the child process.
  examples:
    - nox run app -- --verbose
  links:
    - label: Read run behavior
      href: /docs/commands

test:
  summary: Run the noxfile task named test.
  details:
    - This is shorthand for nox task test. It does not choose or configure a test framework by itself.
  examples:
    - nox test
  links:
    - label: Read task behavior
      href: /tasks

task:
  summary: Run a named noxfile task.
  details:
    - Tasks can invoke shell commands, depend on other tasks, invoke Nox commands, and interpolate build-directory or version values.
  examples:
    - nox task format
  links:
    - label: Read task syntax
      href: /tasks

install:
  summary: Build and copy install-marked targets into an install prefix.
  details:
    - Executables are installed in prefix/bin and libraries in prefix/lib. Targets without install = true are not copied.
  examples:
    - nox install --prefix "$HOME/.local"
  links:
    - label: Read installation behavior
      href: /docs/commands

uninstall:
  summary: Remove installed targets from a prefix.
  details:
    - It removes files for install-marked targets without compiling the project. Use the same prefix originally used for install.
  examples:
    - nox uninstall --prefix "$HOME/.local"
  links:
    - label: Read installation behavior
      href: /docs/commands

update:
  summary: Update Nox through Cargo.
  details:
    - The default stable update checks the master branch; --dev and --channel dev select the development branch; --version requests an exact newer release.
  examples:
    - nox update
  links:
    - label: Read update instructions
      href: /download

help:
  summary: Show the command list or detailed help for one command.
  details:
    - Supply a command name to view its usage, accepted options, and behavior.
  examples:
    - nox help build
  links:
    - label: Open the command reference
      href: /docs/commands
