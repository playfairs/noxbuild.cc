_cli_definition: &cli_definition
  summary: A Nox command, alias, or command-line option.
  details:
    - CLI values select project operations, build directories, configurations, tool flags, output, or forwarded child arguments.
    - Every command accepts --help; command-specific behavior is documented in the CLI reference.
  examples:
    - nox help build
    - nox build --release
  links:
    - label: Read the CLI reference
      href: /docs/commands

